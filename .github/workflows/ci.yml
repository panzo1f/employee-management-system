name: NovaHR CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test & Validate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: novahr_test
          POSTGRES_USER: novahr
          POSTGRES_PASSWORD: novahr_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novahr -d novahr_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://novahr:novahr_password@localhost:5432/novahr_test
      SECRET_KEY: test-secret-key
      FLASK_APP: run.py

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate migrations
        run: |
          flask db upgrade
          flask db current

      - name: Run tests
        run: |
          pytest -q

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push NovaHR image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: zuapanzo/novahr:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max