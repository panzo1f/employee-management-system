name: NovaHR CD

on:
  workflow_run:
    workflows:
      - NovaHR CI
    types:
      - completed

jobs:
  deploy:
    name: Deploy NovaHR
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
#1
    steps:
      - name: Test SSH connectivity
        run: |
          echo "Testing SSH connectivity..."
          echo "Host: ${{ secrets.DEPLOY_HOST }}"
          echo "Port: ${{ secrets.DEPLOY_PORT }}"
          timeout 15 bash -c "</dev/tcp/${{ secrets.DEPLOY_HOST }}/${{ secrets.DEPLOY_PORT }}"
          echo "TCP connection successful"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e

            cd /home/pedro/employee-management-system

            echo "Updating repository..."
            git pull origin main

            echo "Rebuilding NovaHR..."
            docker compose build novahr

            echo "Starting services..."
            docker compose up -d

            echo "Checking services..."
            docker compose ps 