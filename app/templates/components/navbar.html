<nav class="navbar-top">

    <!-- Left side -->

    <div class="navbar-left">

        <button
            type="button"
            class="sidebar-toggle"
            id="sidebarToggle"
            aria-label="Abrir menu"
        >
            <i class="bi bi-list"></i>
        </button>

        <div class="breadcrumb-area">

            <span class="breadcrumb-current">
                {% if request.endpoint == 'departments.list_departments' %}
                    Departamentos
                {% elif request.endpoint == 'departments.create_department' %}
                    Novo Departamento
                {% elif request.endpoint == 'dashboard.index' %}
                    Dashboard
                {% else %}
                    NovaHR
                {% endif %}
            </span>

        </div>

    </div>


    <!-- Right side -->

    <div class="navbar-right">

        <!-- Search -->

        <div class="navbar-search">

            <i class="bi bi-search"></i>

            <input
                type="text"
                placeholder="Pesquisar..."
                aria-label="Pesquisar"
            >

        </div>


        <!-- Notifications -->

        <button
            type="button"
            class="navbar-icon-button"
            aria-label="Notificações"
        >

            <i class="bi bi-bell"></i>

            <span class="notification-badge">
                3
            </span>

        </button>


        <!-- Divider -->

        <div class="navbar-divider"></div>


        <!-- User -->

        <div class="navbar-user">

            <div class="navbar-user-avatar">
                <i class="bi bi-person-fill"></i>
            </div>

            <div class="navbar-user-info">

                <span class="navbar-user-name">
                    Pedro
                </span>

                <span class="navbar-user-role">
                    Administrador
                </span>

            </div>

            <i class="bi bi-chevron-down navbar-user-arrow"></i>

        </div>

    </div>

</nav>
