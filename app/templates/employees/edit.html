{% extends "layouts/base.html" %}

{% block title %}
Editar Funcionário | NovaHR
{% endblock %}

{% block content %}

<div class="page-content">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h1 class="h3 mb-1">Editar Funcionário</h1>

            <p class="text-muted mb-0">
                Atualize as informações do funcionário.
            </p>
        </div>

        <a
            href="{{ url_for('employees.employee_details', employee_id=employee.id) }}"
            class="btn btn-outline-secondary"
        >
            <i class="bi bi-arrow-left me-1"></i>
            Voltar
        </a>

    </div>

    <div class="card shadow-sm border-0">

        <div class="card-body">

            <form
                method="POST"
                action="{{ url_for('employees.edit_employee', employee_id=employee.id) }}"
            >

                <div class="row g-3">

                    <!-- First Name -->
                    <div class="col-md-6">

                        <label
                            for="first_name"
                            class="form-label"
                        >
                            First Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="first_name"
                            name="first_name"
                            value="{{ employee.first_name }}"
                            required
                        >

                    </div>

                    <!-- Last Name -->
                    <div class="col-md-6">

                        <label
                            for="last_name"
                            class="form-label"
                        >
                            Last Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="last_name"
                            name="last_name"
                            value="{{ employee.last_name }}"
                            required
                        >

                    </div>

                    <!-- Email -->
                    <div class="col-md-6">

                        <label
                            for="email"
                            class="form-label"
                        >
                            Email
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            value="{{ employee.email }}"
                            required
                        >

                    </div>

                    <!-- Phone -->
                    <div class="col-md-6">

                        <label
                            for="phone"
                            class="form-label"
                        >
                            Phone
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="phone"
                            name="phone"
                            value="{{ employee.phone or '' }}"
                        >

                    </div>

                    <!-- Position -->
                    <div class="col-md-6">

                        <label
                            for="position"
                            class="form-label"
                        >
                            Position
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="position"
                            name="position"
                            value="{{ employee.position }}"
                            required
                        >

                    </div>

                    <!-- Department -->
                    <div class="col-md-6">

                        <label
                            for="department_id"
                            class="form-label"
                        >
                            Department
                        </label>

                        <select
                            class="form-select"
                            id="department_id"
                            name="department_id"
                            required
                        >

                            <option value="">
                                Select department
                            </option>

                            {% for department in departments %}

                                <option
                                    value="{{ department.id }}"
                                    {% if department.id == employee.department_id %}selected{% endif %}
                                >
                                    {{ department.name }}
                                </option>

                            {% endfor %}

                        </select>

                    </div>

                    <!-- Hire Date -->
                    <div class="col-md-6">

                        <label
                            for="hire_date"
                            class="form-label"
                        >
                            Hire Date
                        </label>

                        <input
                            type="date"
                            class="form-control"
                            id="hire_date"
                            name="hire_date"
                            value="{{ employee.hire_date.strftime('%Y-%m-%d') }}"
                            required
                        >

                    </div>

                    <!-- Salary -->
                    <div class="col-md-6">

                        <label
                            for="salary"
                            class="form-label"
                        >
                            Salary
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            id="salary"
                            name="salary"
                            step="0.01"
                            min="0"
                            value="{{ employee.salary or '' }}"
                        >

                    </div>

                </div>

                <hr class="my-4">

                <div class="d-flex justify-content-end gap-2">

                    <a
                        href="{{ url_for('employees.employee_details', employee_id=employee.id) }}"
                        class="btn btn-outline-secondary"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        <i class="bi bi-check-lg me-1"></i>
                        Save Changes
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
