services:

  sonarqube:
    image: sonarqube:lts-community
    container_name: novahr-sonarqube

    restart: unless-stopped

    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"

    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions

    networks:
      - novahr_network

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=employee-management-system_novahr_network"
      - "traefik.http.routers.sonarqube.rule=Host(`sonarqube.local`)"
      - "traefik.http.routers.sonarqube.entrypoints=web"
      - "traefik.http.services.sonarqube.loadbalancer.server.port=9000"


volumes:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:


networks:
  novahr_network:
    external: true
    name: employee-management-system_novahr_network
