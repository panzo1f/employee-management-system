services:

  prometheus:
    image: prom/prometheus:latest
    container_name: novahr-prometheus
    restart: unless-stopped

    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    networks:
      - novahr_network

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=employee-management-system_novahr_network"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.local`)"
      - "traefik.http.routers.prometheus.entrypoints=web"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"


  grafana:
    image: grafana/grafana:latest
    container_name: novahr-grafana
    restart: unless-stopped

    volumes:
      - grafana_data:/var/lib/grafana

    networks:
      - novahr_network

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=employee-management-system_novahr_network"
      - "traefik.http.routers.grafana.rule=Host(`grafana.local`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"


  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: novahr-cadvisor
    restart: unless-stopped

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

    networks:
      - novahr_network


volumes:
  prometheus_data:
  grafana_data:


networks:
  novahr_network:
    external: true
    name: employee-management-system_novahr_network